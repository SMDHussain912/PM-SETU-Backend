name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, migrate, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pm_setu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pm_setu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pm_setu_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pm_setu_test?schema=public
      PM_SETU_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pm_setu_test?schema=public
      NODE_ENV: test
      PORT: 3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to isolated CI database
        run: npm run db:migrate:deploy

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run middleware and PostgreSQL scope integration tests
        run: npm test

      - name: Build production output
        run: npm run build
