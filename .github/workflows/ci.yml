name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, generate, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      # Prisma 7 loads prisma.config.ts during client generation.
      # This isolated placeholder is not used to connect to a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pm_setu_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run RBAC middleware tests
        run: npm test

      - name: Build production output
        run: npm run build
