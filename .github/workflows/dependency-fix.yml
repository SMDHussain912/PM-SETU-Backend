name: Resolve npm audit advisories

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-security-fix
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: Apply compatible npm security fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply semver-compatible security fixes
        id: audit-fix
        shell: bash
        run: |
          set +e
          npm audit fix
          audit_status=$?
          set -e

          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(deps): apply npm audit security fixes"
            git push origin HEAD:main
          else
            echo "No semver-compatible lockfile changes were produced."
          fi

          exit "$audit_status"
